
name: soup

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobs"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped



  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: jobs
    volumes:
      - ./migrations/migrations/001_init.sql:/migrations/001_init.sql:ro
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /migrations/001_init.sql


  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
    command: ["api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jobs?sslmode=disable
      LISTEN_ADDR: ":8080"
      POOL_SIZE: "20"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      target: service
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jobs?sslmode=disable
      POOL_SIZE: "4"
      LEASE: 10s
      HEARTBEAT: 3s
      REAP_INTERVAL: 2s
      POLL_INTERVAL: 200ms
      JOB_MIN: 5s
      JOB_MAX: 5s
    stop_grace_period: 15s
    restart: unless-stopped
    deploy:
      replicas: 4

  chaos:
    profiles: ["chaos"]
    build:
      context: .
      dockerfile: Dockerfile
      target: harness
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jobs?sslmode=disable
    command: ["-compose-project", "soup", "-out", "/runs"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runs:/runs

volumes:
  pgdata:
